system_prompt: You are an insurance expert assistant that can efficiently analyze and solve insurance-related problems while considering multiple perspectives

expert_profile: You are an experienced insurance professional with expertise in risk assessment, claims processing, and policy analysis. You approach problems systematically while considering both technical and human aspects of insurance scenarios.

thinking_styles:
  - "What are the insurance implications and risk factors to consider?"
  - "How can we break down this situation into manageable components for thorough analysis?"
  - "What are the regulatory and compliance considerations?"
  - "What precedents exist for similar cases in insurance history?"
  - "How do we balance customer needs with risk management?"
  - "What are the potential financial impacts of each solution?"
  - "How can we ensure fair treatment while maintaining business sustainability?"
  - "What preventive measures could help avoid similar situations?"
  - "Are there any coverage gaps or policy limitations to consider?"
  - "Critical Analysis: Examine the situation from both the insurer's and insured's perspectives, considering legal, financial, and ethical implications."
  - "Customer-Centric Thinking: Consider the impact on policyholder satisfaction and long-term relationship while maintaining compliance."
  - "Risk Assessment: Evaluate potential exposures, claim scenarios, and mitigation strategies."
  - "Collaborative Approach: Consider input from underwriting, claims, legal, and customer service perspectives."
  - "Compliance Focus: Ensure solutions align with insurance regulations and industry standards."
  - "Data-Driven Decision Making: Utilize historical claims data and market trends to inform solutions."
  - "What is the core insurance issue that needs to be addressed?"
  - "Are there any coverage exclusions or special conditions that apply?"
  - "What documentation or evidence is needed to support the decision?"
  - "How might this decision impact future similar cases?"
  - "What are the immediate and long-term cost implications?"
  - "Are there any reputational risks to consider?"
  - "How can we improve communication with stakeholders?"
  - "What preventive measures or policy adjustments could help?"
  - "How does this align with our underwriting guidelines?"
  - "What are the claim settlement options available?"


# ans_delimiter_instruction: " Wrap only your final answer, without reason for each question separately between <ANS_START> and <ANS_END> tags."
ans_delimiter_instruction: ""

meta_critique_template: |
  I'm trying to write a zero-shot instruction that will help the most capable and suitable agent to solve the task.
  My current prompt is: "{instruction}"
  But this prompt gets the following examples wrong: {examples}
  Provide detail feedback which identifies reasons where the instruction could have gone wrong.
  Wrap each reason with <START> and <END>
  

meta_positive_critique_template: |
  I'm trying to write a prompt for zero-shot instruction task that will help the most capable and suitable agent to solve the task.
  My current prompt is:
  [CURRENT PROMPT] "{instruction}"
  Now this prompt got the following examples correct:
  [CORRECT EXAMPLES] {examples}
  Since you cant use these examples, analyse and understand characteristics/complexity and diversity of these examples and their reasoning chain and
  accordingly provide suggestions to further improve the prompt and make it better as a zero shot instruction task.
    

critique_refine_template: |
  I'm trying to write a zero-shot instruction that will help the most capable and suitable agent to solve the task.
  My current prompt is: "{instruction}"
  But this prompt gets the following examples wrong: {examples}
  On carefully analysing these examples, following are the critiques related to prompt {critique}
  Use the critique smartly, refine the current prompt to make sure we dont get these examples wrong.
  Based on the above information, Now I want you to write {steps_per_sample} different improved prompts.
  Each prompt should be wrapped with <START> and <END>.
  [Refined Prompts]:


